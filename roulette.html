<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>머슬캐슬 룰렛 이벤트</title>
<style>
    body {
        background: #111;
        color: #fff;
        text-align: center;
        font-family: 'Pretendard', sans-serif;
        margin: 0;
        padding: 0;
    }

    h1 {
        margin-top: 30px;
        font-size: 24px;
    }

    .wheel-container {
        margin: 40px auto;
        width: 300px;
        height: 300px;
        position: relative;
    }

    /* 🔥 5등분 룰렛 (색상은 추후 변경 가능) */
    #wheel {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        border: 5px solid #fff;
        transition: transform 4s cubic-bezier(0.1, 0.9, 0.2, 1);
        background: conic-gradient(
            #ef4444 0deg 72deg,     /* 30% → 1번 */
            #f97316 72deg 144deg,   /* 25% → 2번 */
            #eab308 144deg 216deg,  /* 20% → 3번 */
            #22c55e 216deg 288deg,  /* 15% → 4번 */
            #3b82f6 288deg 360deg   /* 10% → 5번 */
        );
    }

    /* 포인터 */
    .pointer {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-bottom: 20px solid #fff;
    }

    #spinButton {
        background: #facc15;
        color: #000;
        padding: 15px 40px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
    }

    #spinButton:disabled {
        background: #555;
        cursor: not-allowed;
    }

    #resultBox {
        margin-top: 20px;
        font-size: 20px;
        line-height: 1.4;
    }

    .result-highlight {
        color: #facc15;
        font-size: 24px;
        font-weight: 800;
    }
</style>
</head>
<body>

<h1>🎉 머슬캐슬 룰렛 이벤트 🎉</h1>

<div class="wheel-container">
    <div class="pointer"></div>
    <div id="wheel"></div>
</div>

<button id="spinButton">룰렛 돌리기</button>

<div id="resultBox"></div>

<script>
(function() {

  const wheel = document.getElementById('wheel');
  const spinButton = document.getElementById('spinButton');
  const resultBox = document.getElementById('resultBox');

  // 🔥 5개 상품 + 확률(weight)
  const prizes = [
    { label: "7일 추가 이용권", weight: 30 },
    { label: "10일 추가 이용권", weight: 25 },
    { label: "상품3", weight: 20 },
    { label: "상품4", weight: 15 },
    { label: "상품5", weight: 10 }
  ];

  const sectionAngle = 360 / 5;

  // ⭐ 1회 제한 체크
  if (localStorage.getItem("mcf_event_done") === "true") {
    spinButton.disabled = true;
    resultBox.innerHTML = "이미 참여하셨습니다.<br>이 화면을 데스크에 보여주세요.";
  }

  let isSpinning = false;

  // 🎯 확률 기반 랜덤 선택
  function pickPrize() {
    const total = prizes.reduce((sum, p) => sum + p.weight, 0);
    let r = Math.random() * total;
    for (let p of prizes) {
      if (r < p.weight) return p;
      r -= p.weight;
    }
    return prizes[0];
  }

  function spinWheel() {
    if (isSpinning) return;

    if (localStorage.getItem("mcf_event_done") === "true") {
      alert("이미 참여하셨습니다.");
      return;
    }

    isSpinning = true;
    spinButton.disabled = true;
    resultBox.innerHTML = "🎯 돌리는 중...";

    // 🎯 당첨 상품 선택
    const selectedPrize = pickPrize();
    const index = prizes.indexOf(selectedPrize);

    // 🔥 회전각 설정
    const randomTurns = 4 + Math.floor(Math.random() * 2); 
    const targetAngle = randomTurns * 360 + (index * sectionAngle) + (sectionAngle / 2);

    wheel.style.transform = `rotate(${targetAngle}deg)`;

    wheel.addEventListener("transitionend", function endSpin() {
      wheel.removeEventListener("transitionend", endSpin);

      // 🔒 1회 참여 제한 저장
      localStorage.setItem("mcf_event_done", "true");

      alert("🎉 축하합니다!\n당첨: " + selectedPrize.label);

      resultBox.innerHTML = `
        혜택: <span class="result-highlight">${selectedPrize.label}</span><br>
        이 화면을 데스크에 보여주세요.
      `;

      isSpinning = false;
    }, { once: true });
  }

  spinButton.addEventListener("click", spinWheel);
})();
</script>

</body>
</html>
